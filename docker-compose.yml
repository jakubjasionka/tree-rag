services:
  tree-rag-engine:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TREE_RAG_BASE_DIR: /data/treerag
      TREE_RAG_DEFAULT_WORKSPACE: default
      EMBED_URL: http://embed-mock:8089/v1
      TREE_RAG_EMBED_MODEL: compact-multilingual-cpu-100m
      MEMORY_GUARD_DISABLE: "0"
    volumes:
      - treerag_data:/data/treerag
    command: ["health"]

  embed-mock:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app:ro
    command:
      - python
      - -c
      - |
        import http.server, json
        class Handler(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"status": "ready", "device": "cpu"}).encode())
        http.server.HTTPServer(("0.0.0.0", 8089), Handler).serve_forever()
    ports:
      - "8089:8089"

volumes:
  treerag_data:
